<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- #410 デザイン刷新のモック。数値・名前はすべてサンプル -->
<title>catalyzer 全画面モック</title>
<style>
  /* レイアウト: 左に画面一覧、中央にスマホ幅のアプリ、右にその画面の設計メモ。狭い画面では縦に積む */
  :root {
    color-scheme: dark;
    --bg: #0e141b; --surface: #18212b; --surface-2: #212c38; --fg: #e9eef3; --muted: #a2b1bf;
    --line: #2a3644; --accent: #5ec6f2; --on-accent: #06222f; --win: #6fdc9f; --lose: #ff8d80; --warn: #f2c14e;
    --s1: #5ec6f2; --s2: #ff9e7a; --s3: #6fdc9f; --s4: #f2c14e;
    --font: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light; --bg: #f4f6f8; --surface: #ffffff; --surface-2: #e7ecf0; --fg: #17202a; --muted: #4f5d6b; --line: #d5dbe1; --accent: #0a6c99; --on-accent: #ffffff; --win: #13803f; --lose: #c4321f; --warn: #8a5a00; --s1: #0a6c99; --s2: #c2541f; --s3: #13803f; --s4: #8a6a00;
  } }
  :root[data-theme="light"] { color-scheme: light; --bg: #f4f6f8; --surface: #ffffff; --surface-2: #e7ecf0; --fg: #17202a; --muted: #4f5d6b; --line: #d5dbe1; --accent: #0a6c99; --on-accent: #ffffff; --win: #13803f; --lose: #c4321f; --warn: #8a5a00; --s1: #0a6c99; --s2: #c2541f; --s3: #13803f; --s4: #8a6a00; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .stage { display: grid; grid-template-columns: 180px minmax(0, 420px) minmax(0, 360px); justify-content: center; gap: 40px; padding: 32px 16px 64px; align-items: start; }
  .screens { position: sticky; top: 24px; }
  .screens h1 { font-size: 16px; margin: 0 0 12px; }
  .screens ul { list-style: none; margin: 0; padding: 0; }
  .screens button { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; min-height: 40px; }
  .screens button[aria-current="true"] { color: var(--fg); font-weight: 700; border-left-color: var(--accent); }
  .screens p { font-size: 14px; color: var(--muted); margin: 16px 0 0; }
  @media (max-width: 1080px) {
    .stage { grid-template-columns: minmax(0, 420px); padding: 0 0 48px; gap: 24px; }
    .screens { position: static; padding: 16px 16px 0; }
    .screens ul { display: flex; gap: 4px; overflow-x: auto; }
    .screens li { flex: none; }
    .screens button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 8px 10px; }
    .screens button[aria-current="true"] { border-bottom-color: var(--accent); }
    .notes { padding: 0 16px; }
  }

  /* ===== アプリ枠 ===== */
  .app { position: relative; display: flex; flex-direction: column; height: 820px; background: var(--bg); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
  @media (max-width: 1080px) { .app { border-left: 0; border-right: 0; border-radius: 0; height: 760px; } }
  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .appbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
  .appbar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .appbar h2 { font-size: 20px; line-height: 1.3; margin: 0; }
  .iconbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--accent); font-size: 14px; min-height: 44px; padding: 0 4px; cursor: pointer; }
  .iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .filters { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; cursor: pointer; white-space: nowrap; }
  .chip .k { color: var(--muted); }
  .chip .cut { max-width: 7.5em; overflow: hidden; text-overflow: ellipsis; }
  .filters .seg { margin-left: auto; }
  .chip.set { border-color: var(--accent); }
  .chip::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); margin-left: 2px; }
  .seg { display: inline-flex; flex: none; background: var(--surface-2); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; border-radius: 6px; padding: 0 12px; min-height: 40px; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
  .tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 0; min-height: 44px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--fg); font-weight: 700; border-bottom-color: var(--accent); }

  .page { padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 36px; }
  .sample { font-size: 14px; color: var(--muted); margin: -8px 0 -20px; }

  /* 要約: 画面で唯一の面 */
  .summary { background: var(--surface); border-radius: 16px; padding: 20px 16px; }
  .summary .label { font-size: 14px; color: var(--muted); margin: 0; }
  .big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 0; }
  .big strong { font-size: 44px; line-height: 1.1; font-weight: 700; }
  .big strong small { font-size: 22px; }
  .big .aside { color: var(--muted); }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
  .metrics div { min-width: 0; }
  .metrics dt { font-size: 14px; color: var(--muted); line-height: 1.4; }
  .metrics dd { margin: 2px 0 0; font-size: 22px; font-weight: 700; line-height: 1.3; }
  .metrics dd span { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
  .up { color: var(--win) !important; } .down { color: var(--lose) !important; } .flat { color: var(--muted); }

  section > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h3 { font-size: 18px; line-height: 1.4; margin: 0; }
  h4 { font-size: 15px; margin: 20px 0 4px; color: var(--muted); font-weight: 500; }
  .lead { margin: 4px 0 12px; font-size: 14px; color: var(--muted); }
  .link { background: none; border: 0; color: var(--accent); font-size: 14px; padding: 0; min-height: 44px; cursor: pointer; white-space: nowrap; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 56px; }
  .row:last-child { border-bottom: 0; }
  .row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { grid-column: 1; font-size: 14px; color: var(--muted); }
  .row .val { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-weight: 700; }
  .row .val span { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
  .row.nav { cursor: pointer; }
  .row.nav .val::after { content: ""; display: inline-block; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin-left: 8px; }
  .bar { grid-column: 1; height: 4px; background: var(--surface-2); border-radius: 2px; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--muted); }
  .bar i.up { background: var(--win); } .bar i.down { background: var(--lose); }
  .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--fg); opacity: .35; }
  .bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); }

  .tablewrap { overflow-x: auto; margin: 4px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { font-size: 14px; font-weight: 500; color: var(--muted); text-align: left; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th.sort { cursor: pointer; }
  th.sort::after { content: " ↕"; font-size: 14px; opacity: .6; }
  td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td:first-child { white-space: normal; min-width: 7em; }
  .n { text-align: right; }
  th.n, td.n { padding-left: 8px; padding-right: 0; }
  td.up, td.down { font-weight: 700; }
  .more { display: block; width: 100%; background: none; border: 0; color: var(--accent); min-height: 44px; font-size: 14px; cursor: pointer; }

  .facts { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .facts li { font-size: 15px; padding-left: 16px; position: relative; }
  .facts li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }

  details.disc { border-top: 1px solid var(--line); margin-top: 12px; }
  details.disc > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 44px; cursor: pointer; color: var(--accent); font-size: 14px; }
  details.disc > summary::-webkit-details-marker { display: none; }
  details.disc > summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .15s; }
  details.disc[open] > summary::after { transform: rotate(-135deg); }

  .chart { width: 100%; height: auto; display: block; margin-top: 8px; }
  .chart text { fill: var(--muted); font-size: 13px; font-family: var(--font); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend i.line { height: 2px; vertical-align: 3px; }
  .two { display: grid; grid-template-columns: 1fr; gap: 8px; }

  .heat td, .heat th { text-align: center; padding: 6px 4px; }
  .heat th:first-child { text-align: left; }
  .heat td b { display: block; font-size: 15px; }
  .heat td span { font-size: 14px; color: var(--muted); }

  .partner-pick { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; margin: 8px 0; cursor: pointer; text-align: left; }
  .partner-pick span { color: var(--muted); font-size: 14px; }

  /* フォーム */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field .lbl { font-size: 14px; color: var(--muted); }
  .input { min-height: 48px; width: 100%; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
  .input::placeholder { color: var(--muted); }
  .check { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); }
  .primary { min-height: 52px; width: 100%; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; cursor: pointer; }
  .secondary { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 16px; cursor: pointer; }
  .danger { color: var(--lose); }
  .note { font-size: 14px; color: var(--muted); margin: 0; }
  .legal { font-size: 14px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--line); padding-top: 16px; }
  .legal p { margin: 0 0 8px; }
  .brand { font-size: 28px; font-weight: 700; letter-spacing: .02em; margin: 24px 0 0; }
  .brand span { color: var(--accent); }

  /* 進捗 */
  .progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid var(--line); }
  .steps li:last-child { border-bottom: 0; }
  .steps .st { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .steps .done .st { background: var(--accent); border-color: var(--accent); }
  .steps .done .st::after { content: ""; width: 5px; height: 9px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .steps .now .st { border-color: var(--accent); border-top-color: transparent; animation: spin 1s linear infinite; }
  .steps .wait { color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 通知 */
  .notice { display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 4px 0; }
  .notice::before { content: ""; border-radius: 2px; background: var(--accent); }
  .notice.warn::before { background: var(--warn); }
  .notice.err::before { background: var(--lose); }
  .notice b { display: block; }
  .notice p { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
  .notice .act { margin-top: 8px; }
  .empty { text-align: center; padding: 32px 8px; }
  .empty b { display: block; font-size: 17px; }
  .empty p { color: var(--muted); font-size: 15px; margin: 4px 0 16px; }

  /* 試合 */
  .match { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; cursor: pointer; }
  .res { grid-row: 1 / span 3; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .res.w { background: color-mix(in srgb, var(--win) 18%, transparent); color: var(--win); }
  .res.l { background: color-mix(in srgb, var(--lose) 18%, transparent); color: var(--lose); }
  .match .ms { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .match .vs, .match .who { grid-column: 2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--muted); }
  .match .meta { grid-row: 1 / span 3; grid-column: 3; text-align: right; font-size: 14px; color: var(--muted); }
  .match .meta b { display: block; color: var(--fg); font-size: 16px; }
  .tag { display: inline-block; font-size: 14px; border: 1px solid var(--warn); color: var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
  .daylabel { font-size: 14px; color: var(--muted); padding: 16px 0 4px; border-bottom: 1px solid var(--line); }
  .resulthead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .appliedlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .applied { font-size: 14px; background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }

  .players { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .player { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: none; text-align: left; cursor: pointer; min-height: 64px; min-width: 0; }
  .player[aria-pressed="true"] { border-color: currentColor; }
  .player i { display: block; width: 100%; height: 3px; border-radius: 2px; margin-bottom: 6px; }
  .player b { display: block; font-size: 14px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player span { display: block; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidelabel { font-size: 14px; color: var(--muted); }

  /* シート */
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 16px 16px 0 0; max-height: 85%; display: flex; flex-direction: column; }
  .sheet.full { top: 0; max-height: none; border-radius: 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
  .sheet-head h3 { font-size: 17px; }
  .sheet-body { overflow-y: auto; padding: 8px 16px 16px; }
  .sheet-foot { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  .opt { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; padding: 0; }
  .opt[aria-checked="true"] { color: var(--accent); font-weight: 700; }
  .opt[aria-checked="true"]::after { content: ""; width: 6px; height: 12px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-right: 6px; }
  .opt span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 14px; margin-top: 8px; }
  .cal b { color: var(--muted); font-weight: 400; padding: 4px 0; }
  .cal span { min-height: 40px; display: grid; place-items: center; border-radius: 8px; }
  .cal .in { background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 0; }
  .cal .edge { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
  .formgrid .wide { grid-column: 1 / -1; }
  .range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }

  /* 下部タブバー */
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 10px; min-height: 56px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .tabbar svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }

  .share { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .share button { min-height: 64px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .share i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 14px; font-weight: 700; color: #fff; }

  .confirm { background: var(--surface); border-radius: 12px; padding: 16px; }
  .confirm p { margin: 0 0 12px; }
  .confirm div { display: flex; gap: 8px; }

  /* 設計メモ */
  .notes h2 { font-size: 20px; margin: 0 0 4px; }
  .notes > p { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
  .notes dl { margin: 0; }
  .notes dt { font-weight: 700; padding-top: 12px; border-top: 1px solid var(--line); }
  .notes dd { margin: 4px 0 12px; color: var(--muted); font-size: 15px; }
  .notes .impl { display: inline-block; font-size: 14px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 6px; font-weight: 400; vertical-align: 1px; }
  @media (prefers-reduced-motion: reduce) { .steps .now .st { animation: none; } }
</style>

<div class="stage">
  <nav class="screens" aria-label="画面一覧">
    <h1>画面</h1>
    <ul id="screenlist"></ul>
    <p>数値・名前はすべてサンプルです。アプリ内のボタン、タブ、絞り込みは操作できます。</p>
    <div class="seg" role="group" aria-label="テーマ" style="margin-top:12px"><button type="button" data-theme-set="" aria-pressed="true">端末</button><button type="button" data-theme-set="dark" aria-pressed="false">ダーク</button><button type="button" data-theme-set="light" aria-pressed="false">ライト</button></div>
  </nav>

  <div class="app" id="app">
    <div class="scroll" id="scroll"></div>
    <nav class="tabbar" id="tabbar" aria-label="画面切替">
      <button type="button" data-go="report"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>レポート</button>

  // ===== 描画ヘルパー =====
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tone(wr) { return wr >= 60 ? 'up' : wr <= 40 ? 'down' : ''; }

      }).join('') + '</tr>';

  // 勝率の棒 + 試合数の折れ線。左軸 0-100%、右軸は試合数の最大値
  function combo(labels, wrs, ns, opt) {

    var W = 360, H = 210, L = 34, R = 330, T = 16, B = 170;
    var y = function (v) { return B - (B - T) * v / 100; };
    var maxN = Math.max.apply(null, ns), yn = function (v) { return B - (B - T) * v / maxN; };
    var o = '';
    [0, 50, 100].forEach(function (v) {

      o += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '%</text>';
    });
    o += '<text x="' + (R + 6) + '" y="' + (T + 4) + '">' + maxN + '</text><text x="' + (R + 6) + '" y="' + (B + 4) + '">0</text>';
    var step = (R - L) / labels.length, w = Math.min(28, step * 0.6), pts = [];
    labels.forEach(function (lb, i) {
      var cx = L + step * i + step / 2, wr = wrs[i];
      var c = wr >= 60 ? 'var(--win)' : wr < 50 ? 'var(--lose)' : 'var(--accent)';

      if (i % every === 0) o += '<text x="' + cx.toFixed(1) + '" y="' + (B + 16) + '" text-anchor="middle">' + lb + '</text>';
    });

  }

        '<div class="empty" style="border-top:1px solid var(--line)"><b>覚醒のデータがありません</b><p>試合経過のデータがある試合だけで集計します。新しく取得した試合から表示されます。</p></div>' +
        '</div>';
    } }
  };

  function legal() {
    return '<div class="legal"><p>本サービスは非公式のファンツールです。サンライズ、バンダイナムコエクスペリエンス、バンダイナムコエンターテインメントとは一切関係ありません。</p><p>「機動戦士ガンダム」シリーズの著作権はサンライズおよびサンライズ・MBSに帰属します。ゲームのサービス提供は株式会社バンダイナムコエクスペリエンス、バンダイナムコIDの運営は株式会社バンダイナムコエンターテインメントが行っています。</p></div>';
  }

  // 4人 × (覚醒レーン / OLレーン)。横軸は試合時間 0〜240秒
  function gantt() {
    var L = 56, R = 350, top = 10, lane = 18, rowH = 46, tmax = 240, o = '';
    var x = function (t) { return L + (R - L) * t / tmax; };
    var who = ['自分', 'シロー', 'アムロ', 'シャア'], cols = ['var(--s1)', 'var(--s3)', 'var(--s2)', 'var(--s4)'];
    var ev = [
      { b: [[52, 70, 'F']], o: [[150, 168]], d: [118] },
      { b: [[88, 104, 'S'], [176, 190, 'S']], o: [], d: [140] },
      { b: [[60, 76, 'E']], o: [[120, 136]], d: [96, 172] },
      { b: [[110, 128, 'F']], o: [], d: [150] }
    ];
    [60, 120, 180, 240].forEach(function (t) { o += '<line x1="' + x(t) + '" x2="' + x(t) + '" y1="4" y2="' + (top + rowH * 4) + '" stroke="var(--line)"/><text x="' + x(t) + '" y="' + (top + rowH * 4 + 14) + '" text-anchor="middle">' + t + '秒</text>'; });
    ev.forEach(function (e, i) {
      var y0 = top + i * rowH;
      o += '<text x="0" y="' + (y0 + 16) + '">' + who[i] + '</text>';
      e.b.forEach(function (b) { o += '<rect x="' + x(b[0]) + '" y="' + y0 + '" width="' + (x(b[1]) - x(b[0])) + '" height="' + (lane - 2) + '" rx="2" fill="' + cols[i] + '"><title>' + b[2] + '覚醒 ' + b[0] + '秒</title></rect><text x="' + (x(b[0]) + 3) + '" y="' + (y0 + 13) + '" style="fill:var(--bg);font-weight:700">' + b[2] + '</text>'; });
      e.o.forEach(function (b) { o += '<rect x="' + x(b[0]) + '" y="' + (y0 + lane) + '" width="' + (x(b[1]) - x(b[0])) + '" height="' + (lane - 4) + '" rx="2" fill="' + cols[i] + '" opacity=".45"><title>オーバーリミット</title></rect>'; });
      e.d.forEach(function (t) { o += '<path d="M' + (x(t) - 4) + ' ' + (y0 + 2) + 'l8 8M' + (x(t) + 4) + ' ' + (y0 + 2) + 'l-8 8" stroke="var(--lose)" stroke-width="2"/>'; });
      if (i === 1) o += '<line x1="0" x2="' + R + '" y1="' + (y0 + rowH - 6) + '" y2="' + (y0 + rowH - 6) + '" stroke="var(--muted)" stroke-dasharray="3 3"/>';
    });
    return '<svg class="chart" viewBox="0 0 360 214" role="img" aria-label="試合経過">' + o + '</svg>' +
      '<div class="legend"><span><i style="background:var(--s1)"></i>覚醒（F/S/E）</span><span><i style="background:var(--s1);opacity:.45"></i>オーバーリミット</span><span><b class="down">×</b> 被撃墜</span></div>';
  }

  // ===== シート =====
  function sheet(kind) {
    var head = function (t, full) { return '<div class="sheet' + (full ? ' full' : '') + '" role="dialog" aria-label="' + t + '"><div class="sheet-head"><h3>' + t + '</h3><button class="link" type="button" data-close>閉じる</button></div><div class="sheet-body">'; };
    var h = '<div class="backdrop" data-close></div>';
    if (kind === 'period') {
      h += head('期間') + PERIODS.map(function (p) { return '<button class="opt" type="button" role="menuitemradio" data-period="' + p + '" aria-checked="' + (S.period === p) + '">' + (p === '全データ' ? 'すべて' : '直近' + p) + (p !== '全データ' ? '<span>プレイした日で数える</span>' : '') + '</button>'; }).join('') +
        disc('日付を指定', '<div style="display:flex;justify-content:space-between;align-items:center"><button class="link" type="button">前の月</button><b>2026年9月</b><button class="link" type="button">次の月</button></div><div class="cal">' + '日月火水木金土'.split('').map(function (d) { return '<b>' + d + '</b>'; }).join('') +
          '<span></span><span></span>' + Array.from({ length: 30 }, function (_, i) { var d = i + 1, c = d === 13 || d === 21 ? 'edge' : d > 13 && d < 21 ? 'in' : ''; return '<span class="' + c + '">' + d + '</span>'; }).join('') + '</div>' +
          '<p class="note" style="margin:8px 0">09-13 〜 09-21</p><label class="check"><input type="checkbox">時刻も指定する</label><button class="primary" type="button" data-close style="min-height:44px">この期間で表示</button>') + '</div></div>';
    } else if (kind === 'ms') {
      h += head('機体') + '<input class="input" placeholder="機体名で絞り込む" aria-label="機体名で絞り込む" style="margin:8px 0">' +
        '<button class="opt" type="button" data-ms="0" aria-checked="' + (!S.ms) + '">すべての機体<span>312試合</span></button>' +
        MS.map(function (m, i) { return '<button class="opt" type="button" data-ms="' + (i + 1) + '" aria-checked="' + (S.ms === i + 1) + '">' + esc(m) + '<span>' + MS_N[i] + '試合</span></button>'; }).join('') + '</div></div>';
    } else if (kind === 'partner') {
      h += head('固定相方') + PARTNERS.map(function (p, i) { return '<button class="opt" type="button" data-partner="' + i + '" aria-checked="' + (S.partner === i) + '">' + esc(p[0]) + '<span>' + esc(p[1]) + '・' + p[2] + '試合・' + pct(p[3]) + '</span></button>'; }).join('') + '</div></div>';
    } else if (kind === 'sort') {
      h += head('並べ替え') + ['日付', '与ダメージ', '被ダメージ', '撃墜数', '被撃墜数', 'EXダメージ', 'スコア'].map(function (k, i) { return '<button class="opt" type="button" data-close aria-checked="' + (i === 0) + '">' + k + '</button>'; }).join('') +
        '<div class="seg" style="margin-top:12px"><button type="button" aria-pressed="true">大きい順・新しい順</button><button type="button" aria-pressed="false">小さい順・古い順</button></div>' +
        '<h4>1ページの件数</h4><div class="seg">' + [10, 20, 50, 100, 200].map(function (n) { return '<button type="button" aria-pressed="' + (n === 20) + '">' + n + '</button>'; }).join('') + '</div></div></div>';
    } else if (kind === 'filter') {
      var opts = function (arr) { return arr.map(function (o) { return '<option>' + o + '</option>'; }).join(''); };
      h = '<div class="sheet full" role="dialog" aria-label="絞り込み"><div class="sheet-head"><button class="link" type="button" data-act="clear">クリア</button><h3>絞り込み</h3><button class="link" type="button" data-close>閉じる</button></div><div class="sheet-body"><div class="formgrid" style="margin-top:8px">' +
        '<div class="field wide"><span class="lbl">期間</span><select class="input" aria-label="期間">' + opts(['直近30日', 'すべて', '直近90日', '直近60日', '直近14日', '直近7日', '直近3日', '直近1日']) + '</select></div>' +
        '<div class="field wide"><span class="lbl">自機（複数選択可）</span><button class="input" type="button" style="text-align:left">ガンダム・エアリアル(改修型)、νガンダム</button></div>' +
        '<div class="field wide"><span class="lbl">僚機（複数選択可）</span><button class="input" type="button" style="text-align:left;color:var(--muted)">指定しない</button></div>' +
        '<div class="field wide"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">敵機（複数選択可）</span><div class="seg"><button type="button" aria-pressed="false">すべて含む</button><button type="button" aria-pressed="true">どれかを含む</button></div></div><button class="input" type="button" style="text-align:left;color:var(--muted)">指定しない</button></div>' +
        '<div class="field wide"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">プレイヤー名（部分一致）</span><div class="seg"><button type="button" aria-pressed="true">両方</button><button type="button" aria-pressed="false">相方</button><button type="button" aria-pressed="false">相手</button></div></div><input class="input" placeholder="名前の一部を入力"></div>' +
        '<div class="field wide"><span class="lbl">勝敗</span><div class="seg"><button type="button" aria-pressed="true">すべて</button><button type="button" aria-pressed="false">勝利</button><button type="button" aria-pressed="false">敗北</button></div></div>' +
        '</div>' + disc('詳細な条件', '<div class="formgrid">' +
          '<div class="field wide"><span class="lbl">期間（日付を指定）</span><button class="input" type="button" style="text-align:left;color:var(--muted)">指定しない</button></div>' +
          '<div class="field wide"><span class="lbl">味方のタッグ名（複数選択可）</span><button class="input" type="button" style="text-align:left;color:var(--muted)">指定しない</button></div>' +
          '<div class="field wide"><span class="lbl">相手のタッグ名（部分一致）</span><input class="input" placeholder="タッグ名の一部を入力"></div>' +
          '<div class="field"><span class="lbl">自機コスト</span><select class="input">' + opts(['すべて', '3000', '2500', '2000', '1500']) + '</select></div>' +
          '<div class="field"><span class="lbl">僚機コスト</span><select class="input">' + opts(['すべて', '3000', '2500', '2000', '1500']) + '</select></div>' +
          '<div class="field wide"><span class="lbl">相手のコスト編成</span><select class="input">' + opts(['すべて', '3000 + 3000', '3000 + 2500', '3000 + 2000', '2500 + 2500']) + '</select></div>' +
          ['与ダメージ', '被ダメージ', '撃墜数', '被撃墜数', 'スコア', 'EXダメージ', '覚醒回数'].map(function (k) { return '<div class="field wide"><span class="lbl">' + k + '</span><div class="range"><input class="input" inputmode="numeric" placeholder="下限" aria-label="' + k + 'の下限"><span class="note">〜</span><input class="input" inputmode="numeric" placeholder="上限" aria-label="' + k + 'の上限"></div></div>'; }).join('') +
          '</div>') + '</div><div class="sheet-foot"><span class="note" style="flex:1">124試合が該当</span><button class="primary" type="button" data-close style="width:auto;padding:0 24px;min-height:48px">結果を見る</button></div></div>';
    }
    return h;
  }

  // ===== 設計メモ =====
  var NOTES = {
    login: ['ログイン', '入力欄2つと開始ボタンだけを主役にし、説明は必要な人だけが開く。', [
      ['保持の説明をモーダルから折りたたみへ', 'ⓘボタンで開くモーダルをやめ、チェックボックスの直下で開閉する。画面遷移なしで読める。'],
      ['注意書きは該当する欄の下へ', 'パスワードの扱いはパスワード欄の下に置く。囲み枠の注意書きは使わない。'],
      ['ボタンの文言', '「分析開始」→「分析を始める」。押した結果をそのまま書く。'],
      ['免責表示', '全画面のフッターから、ログイン画面と「その他」の末尾に移す。文字は 14px 以上に上げる。']]],
    progress: ['分析中', '今どこまで進み、あとどれくらい待つかを1画面で示す。', [
      ['段階を見せる', '準備中・取得中・分析中の文言切替を、3段階のチェックリストにする。現在の段階と件数が一目で分かる。'],
      ['速報への導線', '速報レポートがあるときは「速報を見る」ボタンを出す。今は分析中表示とレポートが同じ画面に並んでいる。'],
      ]],
    report: ['レポート', '5タブ構成と各パネルは現行のまま。並べ方と見せ方を変える。', [
      ['ハンバーガー → 下部タブバー', 'レポート・試合検索・総合戦歴・その他を1タップで切り替える。'],
      ['KPI 6枚 → 要約1つ', 'タブの主指標を大きく1つ、残り4つを小さく。どのタブにもあった「対戦数」は上部の説明文に移す。値の良し悪しは今のしきい値（目安）を文で示す。'],
      ['絞り込みは常に見える位置', '期間・機体はチップ、全体/勝利/敗北は切り替えボタンにする。スクロールしても隠さない。長い機体名は省略し、シートで全体を表示する。'],
      ['横棒グラフ → 行リスト', '機体別・敵機・僚機・編成の横棒グラフは、名前と勝率を並べた行にして、下に細いバーを付ける。長い機体名でも切れない。'],
      ['表は折りたたみの中', 'グラフや行リストで要点を見せ、全件の表は「表で見る」に入れる。今の SubSection と同じ扱い。'],
      ['勝率の色分け', '▲▼と行の色は 60% 以上 / 40% 以下（得意・苦手の判定と同じ）。グラフの棒の色は現行どおり 60% 以上 / 50% 未満。'],
      ['アドバイス → 事実の箇条書き', '💡と「圧巻！」をやめ、数値と比較対象だけを書く。'],
      ['用語', '固定相方のレーダーの「自分/相方」は「自機/僚機」にそろえる。']]],
    search: ['試合検索', '結果の一覧を主役にし、条件は全画面のシートで編集する。', [
      ['条件は全画面シート', '今は一覧の上で開閉するパネル。スマホでは結果が押し出されるため、シートで編集して「結果を見る」で戻る。適用中の条件は一覧の上にタグで残す。'],
      ['結果は1行1試合', '勝敗、自機、相手の機体、プレイヤー名、与ダメを1行にまとめる。機体画像のカードより縦に詰まり、一度に多く見られる。'],
      ['日付で区切る', '同じ日の試合を見出しでまとめる。'],
      ['並べ替えと件数', '並べ替え・昇順降順・1ページの件数を1つのシートにまとめる。'],
      ['AND/OR の文言', '「AND/OR」→「すべて含む/どれかを含む」。']]],
    detail: ['試合詳細', 'モーダルから全画面に変え、戻るボタンで検索結果に戻る。', [
      ['4人の切り替え', '色の帯とプレイヤー名・機体名を付けたボタン。初期は自分と相方。味方と敵を左右で分ける。'],
      ['スコア表', '列見出しを機体画像からプレイヤー名に変える。'],
      ['試合経過', '折りたたみをやめて常に表示する。凡例は覚醒・オーバーリミット・被撃墜の3つにまとめる。']]],
    record: ['総合戦歴', 'ガンダムモバイルの通算戦績。分析済みの割合を目立たせる。', [
      ['要約', '通算勝率を大きく、対戦数・K/D・分析済みの割合を小さく。'],
      ['区分名', '区分と記録の項目名はサーバーから受け取る値。モックの区分は CLAUDE.md の記載に合わせた推定。']]],
    more: ['その他', 'ドロワーにあった項目を1画面にまとめる。', [
      ['準備中の項目は出さない', 'EXランキングと機体使用率ランキングは、使えるようになってから載せる。'],
      ['再取得の確認', 'ブラウザの confirm をやめ、その場で確認を展開する。'],
      ['絵文字アイコン', 'メニューの絵文字はやめ、文字だけにする。']]],
    states: ['通知・空の状態', '色の帯と見出し・本文・操作ボタンの3点で書く。', [
      ['警告とエラーを分ける', 'アクセス制限は警告（黄）、ログイン期限切れや取得失敗はエラー（赤）。どちらも次に何をすればよいかをボタンで示す。'],
      ['期間内に試合が無いとき', '今はスケルトン表示のまま止まる。理由と「期間を変更」を出す。<span class="impl">新規実装</span>']]]
  };

  // ===== 描画とイベント =====
  var scrollEl = document.getElementById('scroll'), overlay = document.getElementById('overlay');
  function render(keepScroll) {
    var sc = SCREENS[S.screen], top = scrollEl.scrollTop;
    scrollEl.innerHTML = sc.render();
    if (!keepScroll) scrollEl.scrollTop = 0; else scrollEl.scrollTop = top;
    document.getElementById('tabbar').hidden = !sc.tabbar;
    document.querySelectorAll('#tabbar button').forEach(function (b) { if (b.getAttribute('data-go') === sc.nav) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    overlay.innerHTML = S.sheet ? sheet(S.sheet) : '';
    document.getElementById('screenlist').innerHTML = Object.keys(SCREENS).map(function (k) { return '<li><button type="button" data-go="' + k + '" aria-current="' + (S.screen === k) + '">' + SCREENS[k].name + '</button></li>'; }).join('');
    var n = NOTES[S.screen];
    document.getElementById('notes').innerHTML = '<h2>' + n[0] + '</h2><p>' + n[1] + '</p><dl>' + n[2].map(function (x) { return '<dt>' + x[0] + '</dt><dd>' + x[1] + '</dd>'; }).join('') + '</dl>';
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, [data-detail], [data-act], [data-close], [data-go]');
    if (!t) return;
    var d = t.dataset, keep = false;
    if (d.go) { var back = S.screen === 'detail' && d.go === 'search'; S.screen = d.go; S.sheet = null; S.confirm = false; if (back) { render(); scrollEl.scrollTop = S.searchTop || 0; return; } }
    else if (d.tab) { S.tab = d.tab; }
    else if (d.lens) { S.lens = d.lens; keep = true; }
    else if (d.sheet) { S.sheet = d.sheet; keep = true; }
    else if (d.close !== undefined) { S.sheet = null; keep = true; }
    else if (d.period) { S.period = d.period; S.sheet = null; keep = true; }
    else if (d.ms !== undefined) { S.ms = +d.ms || null; S.sheet = null; keep = true; }
    else if (d.partner !== undefined) { S.partner = +d.partner; S.sheet = null; keep = true; }
    else if (d.eorder) { S.enemyOrder = d.eorder; keep = true; }
    else if (d.detail !== undefined) { S.detail = +d.detail; S.pOn = null; S.searchTop = scrollEl.scrollTop; S.screen = 'detail'; }
    else if (d.pon !== undefined) { S.pOn = (S.pOn || [true, true, false, false]).slice(); S.pOn[+d.pon] = !S.pOn[+d.pon]; keep = true; }
    else if (d.expand) { document.querySelectorAll('[data-more="' + d.expand + '"]').forEach(function (r) { r.hidden = false; }); t.remove(); return; }
    else if (d.themeSet !== undefined) { if (d.themeSet) document.documentElement.setAttribute('data-theme', d.themeSet); else document.documentElement.removeAttribute('data-theme'); document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); }); return; }
    else if (d.act === 'clear') { S.filtersApplied = false; S.sheet = null; keep = true; }
    else if (d.act === 'refetch') { S.confirm = !S.confirm; keep = true; }
    else if (d.act === 'reanalyze') { S.screen = 'progress'; }
    else return;
    render(keep);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(true); }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.detail !== undefined) e.target.click();
  });
  render();
})();
</script>
