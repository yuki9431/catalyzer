name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check-labels:
    runs-on: ubuntu-latest
    outputs:
      skip-ci: ${{ steps.labels.outputs.skip-ci }}
    steps:
      - name: Check PR labels
        id: labels
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"skip-ci"'; then
            echo "skip-ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip-ci=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-labels
    if: needs.check-labels.outputs.skip-ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Build
        run: docker build -t exvs-analyzer .

  lint-go:
    needs: check-labels
    if: needs.check-labels.outputs.skip-ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      - name: Go test
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Go build check
        run: go build ./cmd/server

  test-js:
    needs: check-labels
    if: needs.check-labels.outputs.skip-ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: JS test
        run: node --test 'static/__tests__/*.test.js' 'tools/ui-check/*.test.js' '.github/scripts/*.test.js'

  validate-mslist:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.title, 'MSリスト')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate ms_list.json
        run: |
          python3 -c "
          import json, sys

          with open('data/ms_list.json') as f:
              data = json.load(f)

          # 空でないこと
          if len(data) == 0:
              print('ERROR: ms_list.json is empty')
              sys.exit(1)

          # 必須フィールドチェック
          for i, ms in enumerate(data):
              if not ms.get('Name'):
                  print(f'ERROR: entry {i} has empty Name')
                  sys.exit(1)
              if not ms.get('ImageURL'):
                  print(f'ERROR: entry {i} has empty ImageURL')
                  sys.exit(1)

          # 機体数が減っていないこと（mainブランチと比較）
          import subprocess
          result = subprocess.run(
              ['git', 'show', 'origin/main:data/ms_list.json'],
              capture_output=True, text=True
          )
          if result.returncode == 0:
              main_data = json.loads(result.stdout)
              if len(data) < len(main_data):
                  print(f'ERROR: MS count decreased ({len(main_data)} -> {len(data)})')
                  sys.exit(1)
              print(f'OK: {len(main_data)} -> {len(data)} entries')
          else:
              print(f'OK: {len(data)} entries (no main branch to compare)')
          "
