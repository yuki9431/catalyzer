name: Build

on:
  push:
    branches: [main, develop]
    # イメージ内容の同一性は下流の content key（後述）で判定し、内容が変わらない
    # 変更は再ビルド・デプロイともに自動で no-op になる。ここでは人手の
    # Pulumi.*.yaml・deploy.yml だけの変更でビルドを起動しない最小限の除外のみ行う。
    paths-ignore:
      - "infra/app/Pulumi.*.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# main は prod、それ以外（develop・手動実行した作業ブランチ）は stg に出す
env:
  STACK: ${{ github.ref == 'refs/heads/main' && 'prod' || 'stg' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-deploy-label:
    runs-on: ubuntu-latest
    outputs:
      no-deploy: ${{ steps.check.outputs.no-deploy }}
    steps:
      - name: Check merged PR labels
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "no-deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # コミットメッセージからPR番号を取得（squash mergeでも確実に取れる）
          COMMIT_MSG=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}" \
            --jq '.commit.message' 2>/dev/null || echo "")
          PR_NUMBER=$(echo "$COMMIT_MSG" | grep -o '(#[0-9]*)' | grep -o '[0-9]*' | head -1)

          # コミットメッセージから取れない場合はAPIフォールバック
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "no-deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABELS=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
            --jq '.[].name' 2>/dev/null || echo "")

          if echo "$LABELS" | grep -q "^no-deploy$"; then
            echo "no-deploy=true" >> "$GITHUB_OUTPUT"
            echo "Skipping build: no-deploy label found on PR #${PR_NUMBER}"
          else
            echo "no-deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-deploy-label
    if: needs.check-deploy-label.outputs.no-deploy != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    env:
      # 起動時のバージョン確認HTTPリクエストを省略（CIでは通知不要）
      PULUMI_SKIP_UPDATE_CHECK: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: infra/app
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Compute image content key
        id: key
        run: |
          # Dockerfile が COPY するソース + Dockerfile / .dockerignore の git object hash
          # からイメージ内容を一意に表すキーを算出する。Dockerfile が唯一の真実源。
          srcs=$(grep -E '^COPY ' Dockerfile | grep -v -- '--from=' \
                 | sed -E 's/^COPY +//; s/[[:space:]]+[^[:space:]]+$//')
          inputs=""
          for s in $srcs; do
            h=$(git rev-parse --verify --quiet "HEAD:${s%/}") \
              || { echo "::error::content key: '$s' が git に存在しない（Dockerfile と不整合）"; exit 1; }
            inputs="${inputs}${h}"$'\n'
          done
          inputs="${inputs}$(git rev-parse HEAD:Dockerfile)"$'\n'
          inputs="${inputs}$(git rev-parse --verify --quiet HEAD:.dockerignore || echo '-')"$'\n'
          KEY=$(printf '%s' "$inputs" | sha256sum | cut -c1-16)
          test -n "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.IMAGE_URI }}:$KEY" >> "$GITHUB_OUTPUT"
          echo "Content key: $KEY"

      - name: Build and push image (skip if content unchanged)
        run: |
          IMAGE_KEY="${{ steps.key.outputs.image }}"
          IMAGE_SHA="${{ secrets.IMAGE_URI }}:${{ github.sha }}"
          if gcloud artifacts docker images describe "$IMAGE_KEY" >/dev/null 2>&1; then
            echo "同一内容のイメージが既存: $IMAGE_KEY — ビルドをスキップ"
          else
            gcloud builds submit --config cloudbuild.yaml --substitutions=_IMAGE="$IMAGE_KEY" \
              --service-account="${{ secrets.BUILD_SERVICE_ACCOUNT }}"
            # コミットSHAからも辿れるよう、同一イメージに追跡用タグを付与（失敗してもデプロイは止めず警告に留める）
            gcloud artifacts docker tags add "$IMAGE_KEY" "$IMAGE_SHA" \
              || echo "::warning::追跡用タグ付与に失敗: ${{ github.sha }}"
          fi

      - name: Update Pulumi config with new image
        working-directory: infra/app
        run: |
          pulumi login gs://${{ secrets.PULUMI_STATE_BUCKET }}
          pulumi stack select "$STACK"
          # --secret は毎回ランダムnonceで再暗号化し、同値でも state に差分を生む。
          # 復号済みの現在値と一致するなら config set 自体を打たず、無駄な差分＝
          # 無駄なデプロイを防ぐ。
          current=$(pulumi config get exvs-app:image 2>/dev/null || echo "")
          if [ "$current" = "${{ steps.key.outputs.image }}" ]; then
            echo "image 変更なし（$current）— config set をスキップ"
          else
            pulumi config set exvs-app:image "${{ steps.key.outputs.image }}" --secret
          fi

      - name: Commit updated Pulumi config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "infra/app/Pulumi.${STACK}.yaml"
          if git diff --cached --quiet; then
            echo "イメージ内容に変更なし — commit せず、デプロイはスキップされる"
            echo "CHANGED=false" >> "$GITHUB_ENV"
          else
            git commit -m "ci: update ${STACK} image to ${{ steps.key.outputs.key }}"
            git push
            echo "CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Trigger deploy workflow
        if: env.CHANGED == 'true'
        run: |
          gh workflow run deploy.yml \
            --ref "${{ github.ref_name }}" \
            -f environment="$STACK"
        env:
          GH_TOKEN: ${{ github.token }}

  # main への直接変更（MSリスト自動更新・hotfix・prod イメージ更新コミット）を develop に戻す
  sync-develop:
    needs: [check-deploy-label, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.check-deploy-label.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge main into develop
        env:
          GH_TOKEN: ${{ github.token }}
          NO_DEPLOY: ${{ needs.check-deploy-label.outputs.no-deploy }}
        run: |
          if ! git ls-remote --exit-code --heads origin develop >/dev/null; then
            echo "::notice::develop ブランチが無いため同期をスキップ"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            echo "::error::main → develop の自動マージが衝突。手動で解消すること"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "develop は main を取り込み済み"
            exit 0
          fi
          git push origin develop
          # GITHUB_TOKEN の push は build を起動しないため、イメージに効く変更があれば stg を明示的に再ビルドする
          if [ "$NO_DEPLOY" != "true" ] && ! git diff --quiet "$BEFORE" HEAD -- . ':!infra/app/Pulumi.*.yaml' ':!.github/workflows/deploy.yml'; then
            gh workflow run build.yml --ref develop
          fi
