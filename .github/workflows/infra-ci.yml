name: Infra CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # 起動時のバージョン確認HTTPリクエストを省略（CIでは通知不要）
      PULUMI_SKIP_UPDATE_CHECK: "true"

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.PULUMI_STATE_BUCKET }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::PULUMI_STATE_BUCKET is not set. Skipping preview."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-secrets.outputs.skip != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check-secrets.outputs.skip != 'true'
        with:
          node-version: "22"

      # ubuntu-26.04 のランナーには Pulumi CLI が入っていないため明示的に入れる
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        if: steps.check-secrets.outputs.skip != 'true'

      - id: auth
        if: steps.check-secrets.outputs.skip != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install shared dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: infra/shared
        run: npm ci --ignore-scripts

      - name: Install app dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: infra/app
        run: npm ci --ignore-scripts

      - name: Pulumi preview (shared)
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: infra/shared
        shell: bash
        run: |
          pulumi login gs://${{ secrets.PULUMI_STATE_BUCKET }}
          if ! pulumi stack select shared 2>/dev/null; then
            echo "### shared: stack not initialized, skipping" > /tmp/pulumi-preview.txt
            exit 0
          fi
          echo "### shared" > /tmp/pulumi-preview.txt
          pulumi preview 2>&1 | tee -a /tmp/pulumi-preview.txt

      - name: Pulumi preview (app/prod)
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: infra/app
        shell: bash
        run: |
          pulumi login gs://${{ secrets.PULUMI_STATE_BUCKET }}
          if ! pulumi stack select prod 2>/dev/null; then
            echo "### app (prod): stack not initialized, skipping" >> /tmp/pulumi-preview.txt
            exit 0
          fi
          echo "### app (prod)" >> /tmp/pulumi-preview.txt
          pulumi preview 2>&1 | tee -a /tmp/pulumi-preview.txt

      - name: Pulumi preview (app/stg)
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: infra/app
        shell: bash
        run: |
          if ! pulumi stack select stg 2>/dev/null; then
            echo "### app (stg): stack not initialized, skipping" >> /tmp/pulumi-preview.txt
            exit 0
          fi
          echo "### app (stg)" >> /tmp/pulumi-preview.txt
          pulumi preview 2>&1 | tee -a /tmp/pulumi-preview.txt

      - name: Comment preview on PR
        if: steps.check-secrets.outputs.skip != 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW=$(cat /tmp/pulumi-preview.txt 2>/dev/null || echo "Preview output not available")
          gh pr comment "${{ github.event.pull_request.number }}" --body "## Pulumi Preview
          \`\`\`
          ${PREVIEW}
          \`\`\`"
