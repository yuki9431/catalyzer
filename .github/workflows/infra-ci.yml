name: Infra CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/scripts/**"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_image_uri: ${{ secrets.IMAGE_URI }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          if [ -z "$TF_VAR_state_bucket" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::TF_STATE_BUCKET is not set. Skipping plan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-secrets.outputs.skip != 'true'
        with:
          # PR のコードが .git/config のトークンを読めないようにする
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.check-secrets.outputs.skip != 'true'
        with:
          tofu_version_file: infra/.opentofu-version
          tofu_wrapper: false

      # 3つの init で provider の取得を1回にする
      - name: Prepare plugin cache
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tofu-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tofu-plugins" >> "$GITHUB_ENV"

      # 公開 repo のジョブログにプロジェクト ID・番号を出さない。auth が環境変数に書き出す前に登録する
      - name: Mask GCP identifiers
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          SA: ${{ secrets.WIF_PR_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/mask-gcp-ids.sh"'

      - id: auth
        if: steps.check-secrets.outputs.skip != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_PR_SERVICE_ACCOUNT }}

      - name: Check format
        if: steps.check-secrets.outputs.skip != 'true'
        run: tofu fmt -check -recursive infra

      - name: Plan (shared)
        if: steps.check-secrets.outputs.skip != 'true' && !cancelled()
        env:
          TF_VAR_project: ${{ steps.auth.outputs.project_id }}
        run: |
          tofu -chdir=infra/shared init -input=false -lockfile=readonly
          .github/scripts/tofu-plan-summary.sh "shared" infra/shared

      - name: Plan (app/prod)
        if: steps.check-secrets.outputs.skip != 'true' && !cancelled()
        env:
          TF_VAR_project: ${{ steps.auth.outputs.project_id }}
        run: |
          tofu -chdir=infra/app init -input=false -lockfile=readonly -reconfigure -var-file=prod.tfvars
          .github/scripts/tofu-plan-summary.sh "app (prod)" infra/app -var-file=prod.tfvars

      - name: Plan (app/stg)
        if: steps.check-secrets.outputs.skip != 'true' && !cancelled()
        env:
          TF_VAR_project: ${{ steps.auth.outputs.project_id }}
        run: |
          tofu -chdir=infra/app init -input=false -lockfile=readonly -reconfigure -var-file=stg.tfvars
          .github/scripts/tofu-plan-summary.sh "app (stg)" infra/app -var-file=stg.tfvars

      - name: Comment plan on PR
        if: steps.check-secrets.outputs.skip != 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLAN=$(cat /tmp/tofu-plan.txt 2>/dev/null || echo "Plan output not available")
          gh pr comment "${{ github.event.pull_request.number }}" --body "## OpenTofu Plan
          ${PLAN}"
