name: Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/app/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target environment"
        required: true
        default: "stg"
        type: choice
        options:
          - stg
          - prod

jobs:
  detect-environment:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      # develop は stg、main は prod だけを出す(develop→main のマージに含まれる stg の差分で stg を巻き戻さない)
      - id: detect
        env:
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.environment }}
        run: |
          if [ -n "$INPUT" ]; then stack=$INPUT; elif [ "$REF" = refs/heads/main ]; then stack=prod; else stack=stg; fi
          if [ "$stack" = prod ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::prod へのデプロイは main からのみ"
            exit 1
          fi
          echo "stack=$stack" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect-environment
    runs-on: ubuntu-latest
    # environment ごとに GitHub が branch 制限をかけ、WIF の身元(SA)も分かれる
    environment: ${{ needs.detect-environment.outputs.stack }}
    # 同じ環境への apply を重ねない(state の lock 待ちで失敗させない)
    concurrency:
      group: deploy-${{ needs.detect-environment.outputs.stack }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      STACK: ${{ needs.detect-environment.outputs.stack }}
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_image_uri: ${{ secrets.IMAGE_URI }}
      TF_IN_AUTOMATION: "true"

    steps:
      # 起動時のコミットではなくブランチの先端を当てる。再実行や実行順の逆転で古いタグに戻さない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: infra/.opentofu-version
          tofu_wrapper: false

      # 公開 repo のジョブログにプロジェクト ID・番号を出さない。auth が環境変数に書き出す前に登録する
      - name: Mask GCP identifiers
        env:
          SA: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/mask-gcp-ids.sh"'

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # refresh で実物を読み直してから当てる(失敗した更新で state がずれても次の deploy で拾う。#608)
      - name: Deploy with OpenTofu
        env:
          TF_VAR_project: ${{ steps.auth.outputs.project_id }}
        run: |
          tofu -chdir=infra/app init -input=false -lockfile=readonly -var-file="${STACK}.tfvars"
          tofu -chdir=infra/app apply -auto-approve -input=false -lock-timeout=5m -var-file="${STACK}.tfvars"
