name: Update MS List

on:
  schedule:
    - cron: "0 18 * * *"  # 毎日 18:00 UTC（日本時間 03:00）
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    # 公式サイトのログイン情報を読む Cloud Build を起動できる身元。environment mslist は develop のみ
    environment: mslist
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Random delay (0-180 min)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 10800))

      # 既定ブランチ(develop)の未リリース変更を PR に混ぜないよう main から切る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check for existing PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PR=$(gh pr list --search "MSリストを自動更新" --state open --json number --jq '.[0].number')
          if [ -n "$OPEN_PR" ] && [ "$OPEN_PR" != "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Open PR #$OPEN_PR already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 公開 repo のジョブログにプロジェクト ID・番号を出さない。auth が環境変数に書き出す前に登録する
      - name: Mask GCP identifiers
        if: steps.existing-pr.outputs.skip == 'false'
        env:
          SA: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/mask-gcp-ids.sh"'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.existing-pr.outputs.skip == 'false'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.existing-pr.outputs.skip == 'false'

      # 公式サイトは日本以外の IP を 403 で拒否するため、取得だけ東京の Cloud Build で行う(#595)
      - name: Run update-mslist (Cloud Build, asia-northeast1)
        if: steps.existing-pr.outputs.skip == 'false'
        run: |
          set -euo pipefail
          BUCKET="${GOOGLE_CLOUD_PROJECT}-mslist"
          OUT="gs://${BUCKET}/out/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SRC="$RUNNER_TEMP/src"
          mkdir -p "$SRC"
          cp -r go.mod go.sum cmd internal data "$SRC/"
          cat > "$RUNNER_TEMP/cloudbuild.yaml" <<EOF
          steps:
          - name: golang:1.27-alpine@sha256:eb61c3873c97416fff0116553fff65d67a3549f72e11d9758849a689cdd8b523
            entrypoint: go
            args: [run, ./cmd/update-mslist]
            env: [GOTOOLCHAIN=local]
            secretEnv: [USERNAME, PASSWORD]
          availableSecrets:
            secretManager:
            - versionName: projects/${GOOGLE_CLOUD_PROJECT}/secrets/official-site-username/versions/latest
              env: USERNAME
            - versionName: projects/${GOOGLE_CLOUD_PROJECT}/secrets/official-site-password/versions/latest
              env: PASSWORD
          artifacts:
            objects:
              location: ${OUT}/
              paths: [data/ms_list.json, data/national_ms_stats.json]
          logsBucket: gs://${BUCKET}/logs
          options:
            logging: GCS_ONLY
          EOF
          gcloud builds submit "$SRC" \
            --region=asia-northeast1 \
            --config="$RUNNER_TEMP/cloudbuild.yaml" \
            --service-account="projects/${GOOGLE_CLOUD_PROJECT}/serviceAccounts/mslist-build@${GOOGLE_CLOUD_PROJECT}.iam.gserviceaccount.com" \
            --gcs-source-staging-dir="gs://${BUCKET}/source"
          gcloud storage cp "${OUT}/ms_list.json" "${OUT}/national_ms_stats.json" data/

      - name: Check for changes
        id: diff
        if: steps.existing-pr.outputs.skip == 'false'
        run: |
          if git diff --quiet data/ms_list.json data/national_ms_stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN で作ったPRはワークフローを起動しないため、PR作成とマージはPATで行う
      - name: Create PR
        id: create-pr
        if: steps.existing-pr.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="auto/update-mslist-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ms_list.json data/national_ms_stats.json
          git commit -m "chore: MSリストを自動更新（全国統計含む）"
          git push origin "$BRANCH"
          # 機体データは develop を経ずに本番へ出す（main マージで prod が自動デプロイされ、develop へは build.yml が同期する）
          PR_URL=$(gh pr create \
            --base main \
            --title "chore: MSリストを自動更新（全国統計含む）" \
            --body "GitHub Actionsによる自動更新です。CIのバリデーション通過後に自動マージされます。")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for checks and merge
        if: steps.create-pr.outputs.pr_url
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: |
          # CIチェックが登録されるまでポーリング（最大5分）
          CI_DETECTED=false
          for i in $(seq 1 30); do
            if gh pr checks "$PR_URL" 2>/dev/null | grep -q .; then
              echo "CI checks detected"
              CI_DETECTED=true
              break
            fi
            echo "Waiting for CI checks to be registered... ($i/30)"
            sleep 10
          done
          if [ "$CI_DETECTED" = "false" ]; then
            echo "::error::CI checks not detected after 5 minutes"
            exit 1
          fi
          # CIチェックの完了を待つ
          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge --merge "$PR_URL"
