name: Renovate

on:
  schedule:
    # 毎時。3日待ちの解除と CI 通過後の自動マージは実行のたびに行われる
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

# 書き込みはすべて GitHub App のトークンで行い、GITHUB_TOKEN には権限を持たせない
permissions: {}

jobs:
  renovate:
    # App の秘密鍵は environment renovate(develop のみ)に置く
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: renovate
    timeout-minutes: 30
    env:
      # renovate: datasource=github-releases depName=renovatebot/renovate
      RENOVATE_VERSION: 44.227.4
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # コミットの作者を App の bot にそろえる。違うと Renovate が自分のブランチを他人の編集とみなし更新をやめる
      - name: Resolve bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          test -n "$id"
          echo "username=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_USERNAME: ${{ steps.bot.outputs.username }}
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.author }}
